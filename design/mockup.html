<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ready Land Buyers — Redesign Mockup</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#14202e;--mute:#5d6b7c;--line:#e2e7ee;--brand:#1f5f4a;--brand-ink:#fff;--warn:#b45309;--warnbg:#fef3c7;--bad:#b42318;--badbg:#fee4e2;--ok:#067647;--okbg:#dcfae6;--sel:#eaf3ef}
:root[data-theme=dark]{--bg:#0b0f14;--panel:#121820;--ink:#e6ebf1;--mute:#93a1b2;--line:#233040;--brand:#4cc29a;--brand-ink:#06251a;--warn:#fbbf24;--warnbg:#3a2c08;--bad:#f97066;--badbg:#3b1512;--ok:#47cd89;--okbg:#0d2e1d;--sel:#12251f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
.note{background:var(--warnbg);color:var(--warn);padding:6px 16px;font-size:12px;text-align:center}
.app{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 30px)}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;padding:0 8px 14px}.brand small{display:block;font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.08em}
.ni{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between;color:var(--mute)}
.ni.on{background:var(--sel);color:var(--ink);font-weight:600}.ni:hover{background:var(--sel)}
.ni b{font-weight:600;font-size:12px}
.ni:focus-visible,button:focus-visible,.row:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(380px,46%) 1fr;min-width:0}
.list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 30px)}
.top{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:2}
.top h1{margin:0;font-size:18px}.top p{margin:2px 0 10px;color:var(--mute);font-size:13px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{all:unset;cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--mute);background:var(--panel)}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;background:var(--panel)}
.row:hover{background:var(--sel)}.row.on{background:var(--sel);box-shadow:inset 3px 0 var(--brand)}
.rk{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.why{font-size:12px;color:var(--mute)}.name{font-weight:600}
.next{font-size:13px;margin-top:2px}
.due{font-size:12px;font-weight:600;text-align:right;white-space:nowrap}
.due.late{color:var(--bad)}.due.today{color:var(--warn)}.due.none{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-ok{background:var(--okbg);color:var(--ok)}
.deal{overflow:auto;max-height:calc(100vh - 30px);background:var(--bg)}
.head{padding:16px 20px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.head h2{margin:0;font-size:18px}.head .addr{color:var(--mute);font-size:13px}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}.facts span{color:var(--mute)}.facts b{color:var(--ink)}
.seven{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.q{background:var(--panel);padding:10px 20px}.q small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.q div{margin-top:2px}
.nab{position:sticky;top:0;background:var(--brand);color:var(--brand-ink);padding:12px 20px;z-index:2}
.nab small{opacity:.8;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.nab .t{font-size:15px;font-weight:600;margin:1px 0 8px}
.outs{display:flex;gap:6px;flex-wrap:wrap}
.outs button{all:unset;cursor:pointer;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600}
:root[data-theme=dark] .outs button{background:rgba(0,0,0,.2)}
.outs button:hover{background:rgba(255,255,255,.3)}
.follow{display:none;margin-top:10px;background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px}
.follow.show{display:block}.follow p{margin:0 0 8px;font-weight:600}
.follow input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:8px}
.dates{display:flex;gap:6px;flex-wrap:wrap}.dates button{all:unset;cursor:pointer;border:1px solid var(--line);padding:4px 10px;border-radius:8px;font-size:12px}
.dates button.go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{all:unset;cursor:pointer;padding:10px 12px;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--brand);font-weight:600}
.body{padding:16px 20px;display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.card li{margin:3px 0}.card ul{margin:0;padding-left:18px}
.tl{color:var(--mute);font-size:13px}.tl b{color:var(--ink)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mute)}
.mtabs{display:none}
@media(max-width:820px){
 .app{grid-template-columns:1fr}.rail{display:none}
 .main{grid-template-columns:1fr}.list,.deal{max-height:none}
 .deal{display:none}.main.open .list{display:none}.main.open .deal{display:block}
 .mtabs{display:flex;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line)}
 .mtabs button{all:unset;flex:1;text-align:center;padding:12px 0;color:var(--mute);font-size:12px}
 .back{display:block!important}
}
.back{display:none;all:unset;cursor:pointer;color:var(--brand);padding:10px 20px;font-weight:600}
</style>
</head>
<body>
<div class="note">Design mockup with invented placeholder data. Not the live CRM. Click a row, then a result button.</div>
<div class="app">
 <aside class="rail" aria-label="Main navigation">
  <div class="brand">Ready Land Buyers<small>CURATIVE CRM</small></div>
  <button class="ni on">Today <b>6</b></button>
  <button class="ni">Pipeline <b>41</b></button>
  <button class="ni">Title exam <b>5</b></button>
  <button class="ni">Archive <b>128</b></button>
  <div style="flex:1"></div>
  <button class="ni" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Toggle theme</button>
 </aside>
 <div class="main" id="main">
  <section class="list" aria-label="Today's work queue">
   <div class="top">
    <h1>Today</h1>
    <p id="sub">6 things to do. Work top to bottom.</p>
    <input class="search" placeholder="Search address, owner, phone, parcel…" aria-label="Search">
    <div class="chips" role="group" aria-label="Filters">
     <button class="chip on">All 6</button><button class="chip">Calls 3</button><button class="chip">Overdue 2</button><button class="chip">No next action 1</button><button class="chip">Blocked 1</button>
    </div>
   </div>
   <div id="rows"></div>
  </section>
  <section class="deal" id="deal" aria-live="polite"></section>
 </div>
</div>
<nav class="mtabs" aria-label="Sections"><button>Today</button><button>Pipeline</button><button>Title</button><button>Archive</button></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const D=[
 {id:1,why:'Callback promised for today',lead:'Estate of R. Whitfield',addr:'Lot 14, Cedar Rd',county:'Marion',verdict:'ADVANCE',next:'Call Sarah Jones (heir) to confirm probate status',due:'Today',dc:'today',who:'Sarah Jones — heir · (555) 010-0142',block:'Heirship unconfirmed',wait:'Sarah to send case number',ask:'$42k',value:'$78k',spread:'$31k',distress:'Probate · back taxes',tries:'2 attempts · last: voicemail Tue',stage:'Contact',atty:'—'},
 {id:2,why:'3 days overdue',lead:'T. Alvarez',addr:'220 Pine Hollow',county:'Polk',verdict:'ADVANCE',next:'Email payoff request to title company',due:'3d late',dc:'late',who:'Dana @ Gulf Title · dana@example.com',block:'Payoff letter missing',wait:'Gulf Title',ask:'$65k',value:'$120k',spread:'$44k',distress:'Mortgage default',tries:'1 email sent 6d ago',stage:'Title',atty:'M. Reyes'},
 {id:3,why:'No next action — will go stale',lead:'Harlan Family Trust',addr:'12 ac, County Rd 9',county:'Lake',verdict:'ADVANCE',next:'',due:'None',dc:'none',who:'Trustee unknown',block:'Trustee not identified',wait:'—',ask:'—',value:'$55k',spread:'$20k',distress:'Tax lien',tries:'No contact yet',stage:'Investigate',atty:'—'},
 {id:4,why:'Contract expires in 5 days',lead:'K. Osei',addr:'88 Magnolia Ln',county:'Marion',verdict:'ADVANCE',next:'Send curative affidavit for signature',due:'Tomorrow',dc:'today',who:'K. Osei · (555) 010-0177',block:'Affidavit unsigned',wait:'Seller signature',ask:'$90k',value:'$150k',spread:'$48k',distress:'Title defect',tries:'Last call: reached Mon',stage:'Contract',atty:'—'},
 {id:5,why:'Waiting reply, follow up due',lead:'B. Nguyen',addr:'5 Ridge View',county:'Polk',verdict:'ADVANCE',next:'Follow up on offer at $71k',due:'Today',dc:'today',who:'B. Nguyen · (555) 010-0111',block:'—',wait:'Seller decision',ask:'$80k',value:'$110k',spread:'$26k',distress:'Code violation',tries:'Offer sent Fri',stage:'Negotiation',atty:'—'},
 {id:6,why:'Judge review needed',lead:'Estate of M. Price',addr:'Parcel 44-118',county:'Lake',verdict:'ADVANCE',next:'Decide: pursue or kill (open judgment)',due:'Today',dc:'today',who:'Attorney: L. Brandt',block:'Open judgment $12k',wait:'You',ask:'$30k',value:'$60k',spread:'$18k',distress:'Judgment',tries:'—',stage:'Title exam',atty:'L. Brandt'}
];
const OUT=['Reached','Voicemail','No answer','Wrong number','Callback','Price objection','Wants offer','Not interested'];
let cur=0;
const $=s=>document.querySelector(s);
function rows(){ $('#rows').innerHTML=D.map((d,i)=>`<div class="row ${i===cur?'on':''}" tabindex="0" role="button" onclick="openDeal(${i})" onkeydown="if(event.key==='Enter')openDeal(${i})">
 <div class="rk">${i+1}</div>
 <div><div class="name">${d.lead}<span class="tag ${d.dc==='none'?'t-bad':d.dc==='late'?'t-bad':'t-ok'}">${d.stage}</span></div>
 <div class="next">${d.next||'<i>No next action set</i>'}</div><div class="why">${d.why} · ${d.county} Co.</div></div>
 <div class="due ${d.dc}">${d.due}</div></div>`).join(''); }
function openDeal(i){ cur=i; rows(); const d=D[i]; $('#main').classList.add('open');
 $('#deal').innerHTML=`<button class="back" onclick="$('#main').classList.remove('open')">← Today</button>
 <div class="head"><h2>${d.lead}</h2><div class="addr">${d.addr} · ${d.county} County</div>
  <div class="facts"><div><span>Ask </span><b>${d.ask}</b></div><div><span>Value </span><b>${d.value}</b></div><div><span>Spread </span><b>${d.spread}</b></div><div><span>Verdict </span><b>${d.verdict}</b></div></div></div>
 <div class="seven">
  <div class="q"><small>What is this</small><div>${d.distress}</div></div>
  <div class="q"><small>What is wrong</small><div>${d.block}</div></div>
  <div class="q"><small>Waiting for</small><div>${d.wait}</div></div>
  <div class="q"><small>Talk to</small><div>${d.who}</div></div>
  <div class="q"><small>Prior attempts</small><div>${d.tries}</div></div>
 </div>
 <div class="nab"><small>Next action · due ${d.due}</small><div class="t">${d.next||'Set the next action'}</div>
  <div class="outs" role="group" aria-label="Log result">${OUT.map(o=>`<button onclick="logOut('${o}')">${o}</button>`).join('')}</div>
  <div class="follow" id="follow"><p id="fq"></p><input id="fin" value="" aria-label="Next action"><div class="dates"><button onclick="setDate('Tomorrow',this)">Tomorrow</button><button onclick="setDate('In 3 days',this)">3 days</button><button onclick="setDate('Next week',this)">Next week</button><button class="go" onclick="saveNext()">Save and go to next</button></div></div>
 </div>
 <div class="tabs" role="tablist"><button class="tab on" role="tab">Brief</button><button class="tab" role="tab">Title</button><button class="tab" role="tab">Map</button><button class="tab" role="tab">Notes and timeline</button></div>
 <div class="body">
  <div class="card"><h3>Call brief</h3><ul><li><b>Why calling:</b> ${d.why}</li><li><b>Last contact:</b> ${d.tries}</li><li><b>Attorney:</b> ${d.atty}</li><li><b>Objective:</b> get one concrete fact that unblocks “${d.block}”.</li></ul></div>
  <div class="card"><h3>Timeline</h3><div class="tl"><b>Mon</b> Reached seller, wants family approval<br><b>Tue</b> Voicemail<br><b>Last week</b> Title exam finished, verdict ADVANCE</div></div>
 </div>`;
 $('#deal').scrollTop=0; }
function logOut(o){ const d=D[cur]; $('#follow').classList.add('show'); $('#fq').textContent='Result: '+o+'. What happens next?';
 const sug={ 'Voicemail':'Call again','No answer':'Call again','Wrong number':'Find another number','Callback':'Call back at agreed time','Wants offer':'Send offer','Price objection':'Counter-offer or drop price','Reached':'Follow up on what they said','Not interested':'Archive or re-check in 90 days'}[o]||'Follow up';
 $('#fin').value=sug+' — '+d.lead; window._date='Tomorrow'; $('#fin').focus(); }
function setDate(t,b){ window._date=t; b.parentNode.querySelectorAll('button').forEach(x=>x.style.outline=''); b.style.outline='2px solid var(--brand)'; }
function saveNext(){ const d=D[cur]; d.next=$('#fin').value; d.due=window._date||'Tomorrow'; d.dc='today';
 D.push(D.splice(cur,1)[0]); toast('Saved. Next up: '+D[cur].lead); $('#sub').textContent=D.length+' things to do. Work top to bottom.'; rows(); openDeal(cur); }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
document.addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(e.target.tagName))return; if(e.key==='j'&&cur<D.length-1)openDeal(cur+1); if(e.key==='k'&&cur>0)openDeal(cur-1); });
rows(); openDeal(0); $('#main').classList.remove('open');
</script>
</body>
</html>
